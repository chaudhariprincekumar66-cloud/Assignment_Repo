<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
  box-sizing: border-box;
}
.main{
    width: 100%;
    height: 600px;
    border: solid ;

    top: 300px;
    box-sizing: border-box;

}


.navbar {

}

}

.nav-links li {

}

.auth-buttons {

}

button {

}
.nav{

}

</head>

<div class="main">
<div class="navbar">

  </ul>
  </div>

  <div class="auth-buttons">

    </div>
    <div id="B2">

</div>
</div>
