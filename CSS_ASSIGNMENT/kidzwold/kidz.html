<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0%;
        }
        body {
            padding: 0 20px;
        }
        .main{
            width: auto;
            margin: auto;
            padding-left: 30px;
            padding-right: 30px;
            display: flex;
            flex-direction: column;

        }
        .text{
            font-size: 40px;
            color: white;
            width: 180px;
            padding-left: 30px;
        }
        .background p{
            color: white;
            padding-left: 30px;
        }
        .top{
            width: auto;
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: space-between;
            height: 30px;
            padding-top: 20px;
        }
        .background{
            background-image: url(kw-background.png);
            background-size: cover;
            width: auto;
            height: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            flex-wrap: nowrap;
        }
        .card1{
            display: flex;
            flex-direction: row;
            gap: auto; /* Added gap to space out the cards nicely */
            width: auto;
            margin-top: 20px;
            flex-wrap:wrap;
            justify-content: space-between;
            border: solid ;

        }
        .a{
            height: 300px;
            min-height: 200px;
            width: 150px;
        }
        .rupee{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100px;
            margin-top: 5px;
        }
        .rupee p{
            font-weight: bold;
            font-size: 12px;
        }
        .add {
            background-color: #6196FF; 
            color: white; 
            padding: 2px 8px;
            font-size: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="main">
