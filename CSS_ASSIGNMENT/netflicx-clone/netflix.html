<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: #141414;
        }
        .main{
            height: auto;
        }
        .main1{
            background-image: url(Title-Image.png);
            height: 600px;
        }
        .nav{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding-left: 60px;
            padding-right: 60px;
            padding-top: 30px;
        }
        .nav1{
            display: flex;
            flex-direction: row;
            gap: 40px;
            color: white;
            font-size: 16px;
        }
        .nav2{
            display: flex;
            flex-direction: row;
            gap: 40px;
            color:white;

        }
        .maid{
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-top: 200px;
            padding-left: 60px;
        }
        .black{
            height: 800px;
        }
        .card1{
            
            display: grid;
            grid-template-columns: repeat(5,130px);
            grid-template-rows: 130px;
            height: 150px;
            /* border: solid; */
            width: 100vw;
            justify-content: space-evenly;
        }
        .child{
            /* border: solid; */
            
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="main1">
        <div class="nav">
            <div class="nav1">
                <img src="NetflixLogoSvg.png" alt="" style="height: 30px; width: 100px; ">
                <p>Start</p>
                <p>Shows</p>
                <p>Movies</p>
                <p>New</p>
                <p>My List</p>
            </div>
            <div class="nav2">
                <img src="Search (1).png" alt="" style="height: 20px; width: 20px;">
                <img src="GiftBox.png" alt="" style="height: 20px; width: 20px;">
                <img src="NotificationBell.png" alt="" style="height: 20px; width: 20px;">
                <img src="ProfileIMG (1).png" alt="" style="height: 20px; width: 20px;">
                <img src="down_arrow.png" alt="" style="height: 20px; width: 20px;">
            </div>
        </div>
        <div class="maid">
            <div style="display: flex; align-items: center; justify-content: space-between; width: 80px;"><img src="Netflix_Symbol_RGB 1.png" alt="" style="height: 25px; width: 20px;"><p style="color: white; font-size: 18px;">SHOW</p></div>
            <p style="font-size: 80px; color: white; font-weight: bold; font-family: Arial, Helvetica, sans-serif;">MAID</p>
            <div class="play" style="display: flex; gap: 20px;">
                <div style="height: 30px; width: 80px; background-color: white; display: flex; justify-content: center; align-items: center; border-radius: 10px;"><img src="Play.png" alt="" style="height: 20px; width: 15px;"><p>Play</p></div>
                <div style="height: 30px; width: 80px; background-color: white; display: flex; justify-content: center; align-items: center; border-radius: 10px;"><img src="" alt=""><p>More info</p></div>
            </div>
        </div>
        <p style="color: white; padding-left: 60px; padding-top: 100px;">See again <img src="ArrowRight.png" alt="" style="height: 10px; width: 10px; "></p>
        </div>
        <div class="black">
            <div class="card1">
                <div class="child"><img style="width: 230px;" src="section 1.1.png" alt=""></div>
                <div class="child"><img style="width: 230px;"  src="section 1.2.png" alt=""></div>
                <div class="child"><img style="width: 230px;"  src="section 1.3.png" alt=""></div>
                <div class="child"><img style="width: 230px;"  src="section 1.4.png" alt=""></div>
                <div class="child"><img style="width: 230px;"  src="section 1.5.png" alt=""></div>


            </div>
            <div class="card2">
                
            </div>
            

        </div>
    </div>
    
</body>
</html>
